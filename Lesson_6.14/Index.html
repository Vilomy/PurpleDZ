<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>register form</title>
</head>
<body>
    <main>
        <form action="#" method="post">
        <div>
            <h1>Регистрация</h1>
            <div>
                <label for="sig in">Уже есть аккаунт?</label>
                <a id="sig in" href="#">Войти</a>
            </div>
        </div>
        <input type="text" name="company" id="company" placeholder="company name" required>
        <input type="name" name="name" id="name" placeholder="Имя" required>
        <input type="name" name="lastname" id="lastname" placeholder="Фамилия" required>
        <input type="email" name="email" id="email" placeholder="E-mail" required>
        <div>
            <img src="./image/Arrow 1.png" alt="кнопка регистрации">
            <button type="submit">Зарегистрироваться</button>
        </div>

        <div>
            <input type="checkbox" id="agree" required>
            <label for="agree">Я прочитал и принимаю</label>

        </div>
        <a href="#" target="_blank">Условия использования</a>
        </form>
    </main>
</body>
</html>
